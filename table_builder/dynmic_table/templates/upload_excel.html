<!-- حاوية النموذج داخل وسط الصفحة -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">

  <div class="container bg-light p-4 rounded shadow" style="max-width: 600px;">

    <h3 class="box-title titlefix">تحميل ملف Excel</h3>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form_Upload }}
      <div class="row">
        <div class="col-sm-6">

          <div class="text-center">
            <button class="btn btn-outline-primary btn-sm" type="submit">تحميل</button>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="text-center">
            <a href="{% url 'display_data' model_name sys_name_id %}" class="btn btn-outline-primary btn-sm">رجوع</a>
          </div>
        </div>

      </div>


    </form>
  </div>
</div>
