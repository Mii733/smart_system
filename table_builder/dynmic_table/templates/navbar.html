









{% block content %}
<style>
    /* تصميم الجسم الرئيسي */
    body {
        background-color: #f4f6f9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        color: #3c3c3c;
    }

    /* تصميم شريط التنقل العلوي */
    .navbar {
        background-color: #1e2a3a;
        /* اللون الأساسي الداكن */
        overflow: hidden;
        border-radius: 0 0 10px 10px;
    }

    .navbar a {
        float: right;
        display: block;
        color: #fff;
        text-align: center;
        padding: 16px 24px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
    }

    .navbar a:hover {
        background-color: #3498db;
        color: white;
    }

    /* تصميم زر العودة */
    .back-button {
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin-top: 30px;
        transition: background-color 0.3s;
    }

    .back-button:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
    }

    .back-button:active {
        background-color: #1c5981;
        transform: translateY(2px);
    }

</style>
<!-- شريط التنقل العلوي -->
<div class="navbar">
    <a href="{% url 'index' %}">الصفحة الرئيسية</a>
</div>

{% endblock %}
