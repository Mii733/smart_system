<!DOCTYPE html>
<html>
<head>
    <title>MyApp</title>
</head>
<body>
    <h1>Create User Interface:</h1>
    <form method="post" action="{% url 'create_interface' %}">
        {% csrf_token %}
        <label for="name">Interface Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="field_count">Number of Fields:</label>
        <input type="number" id="field_count" name="field_count" required><br><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
