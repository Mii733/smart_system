{% load i18n %}
{% load static %}
{% load crispy_forms_tags %} 





  <body class="login-page" >
    <div class="login-box">
      <div class="login-logo">
        <img src="../media/{{ request.session.img}}" alt="">
      </div>
      <div class="login-box-body" style="box-shadow: 0px 3px 10px black;">
        <p class="login-box-msg" style="    font-size: 22px;
        color: #46787b;">{% trans 'سجل الدخول في حسابك' %}</p>
      {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{message.tags }} text-left" >
            {{ message  }}</div>
            
      {% endfor %}
        
      {% endif %}
        <form action="{% url 'login' %}" method="post" id="log_form">{% csrf_token %}
        {% csrf_token %}
        {{ form|crispy}}
          
          <div class="form-group ">
            <input type="submit" style="background-color: #00a99d;" class="form-control btn btn-primary border-rudus" value="{% trans 'تسجيل الدخول' %}" />
          </div>
         
        </form>

       

      </div><!-- /.login-box-body -->
    </div><!-- /.login-box -->

    <!-- jQuery 2.1.4 -->
   
  </body>
